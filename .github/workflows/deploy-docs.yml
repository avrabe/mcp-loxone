name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'loxone-mcp-rust/docs/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'loxone-mcp-rust/docs/**'

  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: |
          cd docs
          if [ -f "Gemfile" ]; then
            bundle install
          fi

      - name: Build documentation site
        run: |
          cd docs
          # Copy Rust documentation files to main docs
          if [ -d "../loxone-mcp-rust/docs" ]; then
            cp -r ../loxone-mcp-rust/docs/* ./
          fi
          
          # Build with Jekyll if Gemfile exists
          if [ -f "Gemfile" ]; then
            bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          else
            # Simple build - just copy HTML files
            mkdir -p _site
            cp -r *.html *.css *.js *.svg *.png *.ico _site/ 2>/dev/null || true
            if [ -d "assets" ]; then
              cp -r assets _site/
            fi
            if [ -d "images" ]; then
              cp -r images _site/
            fi
            # Copy documentation files
            find . -name "*.md" -exec cp {} _site/ \; 2>/dev/null || true
            find . -name "*.html" -path "./loxone-mcp-rust/*" -exec cp {} _site/ \; 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1